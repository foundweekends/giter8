name: ci
on:
  push:
  pull_request:
  schedule:
  - cron: '0 1 * * *'
jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 17
            os: ubuntu-latest
          - java: 17
            os: windows-latest
          - java: 25
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
    - uses: actions/checkout@v6
    - uses: coursier/cache-action@v8
    - uses: sbt/setup-sbt@v1
    - if: matrix.os == 'ubuntu-latest'
      run: sbt -v "all scalafmtSbtCheck scalafmtCheckAll"
    - run:
        sbt -v
        -no-colors
        coursierBootstrap
        publishLocal
        test
    - if: ${{ matrix.java == '17' && matrix.os == 'ubuntu-latest' }}
      run:
        sbt -v
        -no-colors
        publishLocal
        scripted
        makeSite
  push_gh_pages:
    needs: test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: adopt
    - uses: actions/checkout@v6
      with:
        fetch-depth: 10
    - uses: coursier/cache-action@v8
    - uses: sbt/setup-sbt@v1
    - run: sbt makeSite
    - id: generate_token
      uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
      if: ${{ github.repository_owner == 'foundweekends' && github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
      with:
        app-id: 89697
        private-key: ${{ secrets.FOUNDWEEKENDS_BOT_KEY }}
    - name: Push to gh-pages
      if: ${{ github.repository_owner == 'foundweekends' && github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
      uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
      with:
        GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        BRANCH: gh-pages
        FOLDER: target/site
        CLEAN: true
